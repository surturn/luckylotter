spring:
  application:
    name: lucklotter-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lucklotter}
    username: ${DB_USER:lucklotter}
    password: ${DB_PASSWORD:lucklotter}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          # Mailpit needs neither; a real provider sets both via env.
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # Never let a hung SMTP server stall the dispatch loop.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    # Correlation ID per request, run ID per scheduled scan (NFR-4).
    level: "%5p [correlationId=%X{correlationId:-none} runId=%X{runId:-none}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

lucklotter:
  security:
    # HS256 signing secret for JWTs. Override in every real environment.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
  retention:
    # Daily cadence-break scan (FR-3). Default 02:00 server time.
    scan-cron: ${RETENTION_SCAN_CRON:0 0 2 * * *}
  notifications:
    email:
      # When false the logging stub handles delivery, so the app runs with no
      # mail server at all (§6, §12).
      enabled: ${EMAIL_ENABLED:false}
      from: ${EMAIL_FROM:offers@lucklotter.test}
  seed:
    # Demo data (§13). Off by default: it must never run against pilot data,
    # and it is a no-op anyway once a business exists.
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@lucklotter.test}
    admin-password: ${SEED_ADMIN_PASSWORD:demo-password-123}
