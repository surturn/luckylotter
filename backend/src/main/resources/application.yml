spring:
  application:
    name: lucklotter-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lucklotter}
    username: ${DB_USER:lucklotter}
    password: ${DB_PASSWORD:lucklotter}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

lucklotter:
  security:
    # HS256 signing secret for JWTs. Override in every real environment.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
  retention:
    # Daily cadence-break scan (FR-3). Default 02:00 server time.
    scan-cron: ${RETENTION_SCAN_CRON:0 0 2 * * *}
