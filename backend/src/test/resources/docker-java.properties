# Docker Engine API version used by Testcontainers.
#
# Testcontainers 1.20.4 forces API 1.32 when no version is configured:
# DockerClientProviderStrategy sees RemoteApiVersion.UNKNOWN_VERSION and calls
# withApiVersion(VERSION_1_32). Docker Engine 29 removed every API below 1.44,
# so the strategy's probe (GET /v1.32/info) comes back 400 and Testcontainers
# reports "Could not find a valid Docker environment" — even though the daemon
# is healthy and the docker CLI, which negotiates a current version, works fine.
#
# Setting api.version here makes getApiVersion() non-UNKNOWN, so Testcontainers
# leaves it alone and requests go to /v1.44/. 1.44 is the floor Docker 29 still
# serves (Docker 25.0, Jan 2024) rather than the newest the daemon offers, so
# this stays compatible with older daemons too.
#
# Remove this file once Testcontainers is upgraded to a version that negotiates
# the API version with the daemon.
api.version=1.44
