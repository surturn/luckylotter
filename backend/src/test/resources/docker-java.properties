# Pins the Docker Engine API version used by docker-java (and therefore
# Testcontainers) instead of leaving it unset.
#
# Docker Engine 29 removed support for API versions below 1.44. Left unset,
# Testcontainers forces v1.32 — DockerClientProviderStrategy sees
# RemoteApiVersion.UNKNOWN_VERSION and calls withApiVersion(VERSION_1_32) — so
# the daemon answers /info with HTTP 400 and Testcontainers reports "Could not
# find a valid Docker environment", which reads like a missing daemon rather
# than a rejected API version.
#
# It is Testcontainers, not docker-java, that pins 1.32: left alone docker-java
# sends an unversioned request, which the daemon accepts. So this goes away by
# upgrading Testcontainers to a version that negotiates, not by upgrading
# docker-java.
#
# Raise this only when the minimum supported engine moves; lowering it below
# 1.44 breaks against any Docker 29+ daemon.
api.version=1.44
