services:
  db:
    image: postgres:16
    container_name: lucklotter-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lucklotter}
      POSTGRES_USER: ${POSTGRES_USER:-lucklotter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lucklotter}
    ports:
      - "5432:5432"
    volumes:
      - lucklotter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucklotter -d lucklotter"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outbound offer email and shows it in a browser inbox.
  # Real SMTP, real templates, real failure handling — but nothing can escape
  # to an actual person, which is what makes it safe to point at seeded
  # customers. Swapping to a live provider is env vars only.
  mailpit:
    image: axllent/mailpit:latest
    container_name: lucklotter-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"   # inbox UI
      - "1025:1025"   # SMTP

  backend:
    build: ./backend
    container_name: lucklotter-backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/lucklotter
      DB_USER: ${POSTGRES_USER:-lucklotter}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lucklotter}
      # No fallback, deliberately: a deployment that forgot to set this must
      # fail to start rather than boot with a secret that is public in git
      # (NFR-6). Copy .env.example to .env for local runs.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see .env.example}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_FROM: ${EMAIL_FROM:-offers@lucklotter.test}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@lucklotter.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-demo-password-123}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: lucklotter-frontend
    depends_on:
      - backend
    # nginx proxies /v1 to the backend, so the browser only ever talks to this
    # origin — no CORS configuration anywhere, and the API needs no public port.
    ports:
      - "4200:80"

volumes:
  lucklotter_pgdata:
