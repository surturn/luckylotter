services:
  db:
    image: postgres:16
    container_name: lucklotter-db
    environment:
      POSTGRES_DB: lucklotter
      POSTGRES_USER: lucklotter
      POSTGRES_PASSWORD: lucklotter
    ports:
      - "5432:5432"
    volumes:
      - lucklotter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucklotter -d lucklotter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: lucklotter-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/lucklotter
      DB_USER: lucklotter
      DB_PASSWORD: lucklotter
      JWT_SECRET: dev-only-insecure-secret-change-me-0123456789abcdef
    ports:
      - "8080:8080"

volumes:
  lucklotter_pgdata:
