server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is served from the same origin as the app, so the browser never
    # makes a cross-origin call and the backend needs no CORS configuration.
    location /v1/ {
        # Matches the backend's multipart limit. nginx's own default is 1m and
        # would reject a large POS export with a bare 413 before the app saw it.
        client_max_body_size 21m;
        # A 50,000-row import is synchronous and can run for minutes; the
        # default 60s would answer 504 while the backend carried on importing.
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # nginx rejects an oversized body itself, before the app sees it. Answer in
    # the API's own JSON shape so the import screen can show the message instead
    # of choking on an HTML error page.
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"status":413,"error":"Payload Too Large","message":"That file is too large (limit 20MB). Split it and import in parts."}';
    }

    # Hashed build assets are immutable, so they can be cached hard.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular owns routing: any unknown path is a client route, not a 404.
    # index.html itself must never be cached, or a deploy leaves browsers
    # pointing at asset filenames that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
